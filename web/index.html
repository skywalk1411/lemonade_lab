<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lemonade Lab — Ryzen AI Local Benchmark</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <h1><a href="index.html">Lemonade Lab</a></h1>
      <div class="tagline">Local AI benchmark viewer for AMD Ryzen AI PCs</div>
    </div>
    <nav>
      <a href="index.html" class="active">Report Viewer</a>
      <a href="leaderboard.html">Leaderboard</a>
    </nav>
  </header>

  <label class="dropzone" id="dropzone">
    <input type="file" id="fileInput" accept="application/json">
    <div>Drop a report_*.json file here, or click to browse</div>
    <div class="hint">Generated by <code>python -m bench.cli</code></div>
  </label>

  <div id="report">
    <div class="stat-row" id="statRow"></div>
    <div id="models"></div>
  </div>

  <footer>Lemonade Lab</footer>
</div>

<script>
const BACKEND_META = {
  rocm:   { label: "ROCm",   color: "var(--series-rocm)" },
  vulkan: { label: "Vulkan", color: "var(--series-vulkan)" },
  hybrid: { label: "Hybrid", color: "var(--series-hybrid)" },
  npu:    { label: "NPU",    color: "var(--series-npu)" },
  cpu:    { label: "CPU",    color: "var(--series-cpu)" },
};
const BACKEND_ORDER = ["rocm", "vulkan", "hybrid", "npu", "cpu"];

const dropzone = document.getElementById("dropzone");
const fileInput = document.getElementById("fileInput");

dropzone.addEventListener("click", () => fileInput.click());
fileInput.addEventListener("change", (e) => {
  if (e.target.files[0]) loadFile(e.target.files[0]);
});
["dragenter", "dragover"].forEach(evt =>
  dropzone.addEventListener(evt, (e) => { e.preventDefault(); dropzone.classList.add("drag"); })
);
["dragleave", "drop"].forEach(evt =>
  dropzone.addEventListener(evt, (e) => { e.preventDefault(); dropzone.classList.remove("drag"); })
);
dropzone.addEventListener("drop", (e) => {
  const f = e.dataTransfer.files[0];
  if (f) loadFile(f);
});

function loadFile(file) {
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const data = JSON.parse(reader.result);
      render(data);
    } catch (err) {
      alert("Couldn't parse that file as JSON: " + err.message);
    }
  };
  reader.readAsText(file);
}

function fmtValue(v, unit) {
  if (v === null || v === undefined) return "—";
  return v.toFixed(1) + " " + (unit || "tok/s");
}

const WORKLOAD_LABELS = {
  llm: "LLM Generation",
  embedding: "Embedding Throughput",
  image_gen: "Image Generation",
};

function renderModelCard(modelName, backends) {
  const present = BACKEND_ORDER.filter(b => backends[b]);
  const maxValue = Math.max(
    0, ...present.map(b => backends[b].value || 0)
  );

  const card = document.createElement("div");
  card.className = "model-card";

  const legend = present.map(b =>
    `<div class="legend-item"><span class="legend-swatch" style="background:${BACKEND_META[b].color}"></span>${BACKEND_META[b].label}</div>`
  ).join("");

  let barsHtml = "";
  let tableRows = "";
  for (const b of present) {
    const entry = backends[b];
    const meta = BACKEND_META[b];
    if (entry.error) {
      barsHtml += `
        <div class="bar-row failed">
          <div class="backend-name">${meta.label}</div>
          <div class="bar-track"><div class="tooltip">${entry.error}</div></div>
          <div class="value-label">failed</div>
        </div>`;
      tableRows += `<tr><td>${meta.label}</td><td colspan="2">failed: ${entry.error}</td></tr>`;
      continue;
    }
    const pct = maxValue > 0 ? Math.max(3, (entry.value / maxValue) * 100) : 0;
    const extra = [
      entry.ttft_ms != null ? `TTFT ${entry.ttft_ms.toFixed(0)}ms` : null,
      entry.memory_gb != null ? `${entry.memory_gb.toFixed(1)}GB peak` : null,
    ].filter(Boolean).join(" · ");
    barsHtml += `
      <div class="bar-row">
        <div class="backend-name">${meta.label}</div>
        <div class="bar-track">
          <div class="bar-fill" style="width:${pct}%; background:${meta.color}"></div>
          <div class="tooltip">${fmtValue(entry.value, entry.unit)}${extra ? " · " + extra : ""}</div>
        </div>
        <div class="value-label">${fmtValue(entry.value, entry.unit)}</div>
      </div>`;
    tableRows += `<tr><td>${meta.label}</td><td>${fmtValue(entry.value, entry.unit)}</td><td>${extra || "—"}</td></tr>`;
  }

  const tableId = "tbl-" + Math.random().toString(36).slice(2) + "-" + modelName.replace(/[^a-z0-9]/gi, "-");
  card.innerHTML = `
    <h2>${modelName}</h2>
    <div class="legend">${legend}</div>
    ${barsHtml}
    <button class="table-toggle" data-target="${tableId}">View as table</button>
    <table class="data-table" id="${tableId}">
      <thead><tr><th>Backend</th><th>Value</th><th>Detail</th></tr></thead>
      <tbody>${tableRows}</tbody>
    </table>
  `;
  return card;
}

function render(data) {
  const sys = data.system || {};
  const statRow = document.getElementById("statRow");
  statRow.innerHTML = "";
  const stats = [
    ["CPU", sys.cpu],
    ["Memory", sys.memory],
    ["GPU", sys.gpu],
    ["NPU", sys.npu],
  ];
  for (const [label, value] of stats) {
    const tile = document.createElement("div");
    tile.className = "stat-tile";
    tile.innerHTML = `<div class="label">${label}</div><div class="value">${value ?? "—"}</div>`;
    statRow.appendChild(tile);
  }

  const modelsEl = document.getElementById("models");
  modelsEl.innerHTML = "";

  // New schema: { results: { <workload>: { <model>: { <backend>: {...} } } } }
  // Falls back to the flat { models: { <model>: { <backend>: {...} } } } schema.
  const resultsByWorkload = data.results || { llm: data.models || {} };

  for (const [workload, models] of Object.entries(resultsByWorkload)) {
    if (Object.keys(models).length === 0) continue;
    const section = document.createElement("div");
    section.className = "workload-section";
    const heading = document.createElement("h3");
    heading.className = "workload-heading";
    heading.textContent = WORKLOAD_LABELS[workload] || workload;
    section.appendChild(heading);
    for (const [modelName, backends] of Object.entries(models)) {
      section.appendChild(renderModelCard(modelName, backends));
    }
    modelsEl.appendChild(section);
  }

  modelsEl.querySelectorAll(".table-toggle").forEach(btn => {
    btn.addEventListener("click", () => {
      document.getElementById(btn.dataset.target).classList.toggle("show");
    });
  });

  document.getElementById("report").classList.add("show");
}
</script>
</body>
</html>
